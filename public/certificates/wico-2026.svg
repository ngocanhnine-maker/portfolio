<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1140" width="800" height="1140" style="background:#FBF9F4;font-family:'Times New Roman',Georgia,serif;">
  <defs>
    <linearGradient id="goldMedal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE79A"/>
      <stop offset="30%" stop-color="#DFB135"/>
      <stop offset="70%" stop-color="#9E7611"/>
      <stop offset="100%" stop-color="#E5BE4B"/>
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8731E"/>
      <stop offset="30%" stop-color="#E29B38"/>
      <stop offset="70%" stop-color="#FFBE65"/>
      <stop offset="100%" stop-color="#C57E22"/>
    </linearGradient>
    <linearGradient id="softBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F6F0E6"/>
    </linearGradient>
    <radialGradient id="sealRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9281C"/>
      <stop offset="100%" stop-color="#8F150D"/>
    </radialGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Certificate Paper Base -->
  <rect x="0" y="0" width="800" height="1140" fill="url(#softBg)"/>
  <rect x="25" y="25" width="750" height="1090" fill="none" stroke="#D1C5AF" stroke-width="1.5"/>
  <rect x="32" y="32" width="736" height="1076" fill="none" stroke="#B09F82" stroke-width="0.8" stroke-dasharray="6 3"/>

  <!-- Watermark background emblem -->
  <g opacity="0.04" transform="translate(400, 570) scale(1.6)">
    <circle r="160" fill="none" stroke="#8E2A2A" stroke-width="20"/>
    <path d="M-100,-40 L100,-40 L70,80 L-70,80 Z" fill="#8E2A2A"/>
  </g>

  <!-- Top Header Logos -->
  <g transform="translate(190, 50)">
    <text x="0" y="24" font-family="'Arial Black',Impact,sans-serif" font-size="28" font-weight="900" letter-spacing="1">
      <tspan fill="#0D5C96">W</tspan><tspan fill="#E54124">I</tspan><tspan fill="#3FA535">C</tspan><tspan fill="#F5A800">O</tspan>
    </text>
    <text x="0" y="37" font-family="Arial,sans-serif" font-size="6.5" font-weight="bold" fill="#333" letter-spacing="0.5">WORLD INVENTION</text>
    <text x="0" y="45" font-family="Arial,sans-serif" font-size="6.5" font-weight="bold" fill="#333" letter-spacing="0.5">CREATIVITY OLYMPIC</text>
  </g>

  <g transform="translate(690, 50)">
    <path d="M0,15 C5,5 20,5 25,15 C30,25 15,35 0,25 Z" fill="#0D2E5C"/>
    <text x="32" y="22" font-family="'Arial Black',Impact,sans-serif" font-size="22" font-weight="bold" fill="#0D2E5C">WIIPA</text>
  </g>

  <!-- Certificate Main Title -->
  <g text-anchor="middle" transform="translate(470, 160)">
    <text x="0" y="0" font-size="34" font-weight="bold" fill="#1A1A1A" letter-spacing="1.5">2026 WICO</text>
    <text x="0" y="34" font-size="22" font-style="italic" fill="#333">Certificate of</text>
    <text x="0" y="85" font-size="52" font-weight="bold" font-style="italic" fill="#181818" letter-spacing="1">Gold Award</text>
    <line x1="-190" y1="102" x2="190" y2="102" stroke="#444" stroke-width="1.5"/>
  </g>

  <!-- is Presented to -->
  <text x="470" y="300" text-anchor="middle" font-size="19" fill="#2B2B2B">is Presented to</text>

  <!-- Recipients Box (Pink frame with names) -->
  <g transform="translate(470, 322)">
    <rect x="-175" y="0" width="350" height="95" rx="3" fill="#E8B5B1" fill-opacity="0.45" stroke="#C77D76" stroke-width="1.2"/>
    <text text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="14.5" fill="#111">
      <tspan x="0" y="27">Nguyễn Tùng Chi  /  Tô Thanh Tùng</tspan>
      <tspan x="0" y="53">Nguyễn Trần Mai Hương  /  Trần Ngọc Anh</tspan>
      <tspan x="0" y="78">Huỳnh Khánh Ngọc  /  Nguyễn Ngọc Đan Linh</tspan>
    </text>
  </g>

  <!-- Recognition Citation -->
  <g text-anchor="middle" transform="translate(470, 452)">
    <text x="0" y="0" font-size="16.5" font-style="italic" fill="#222">
      In recognition of the <tspan font-weight="bold">Best Presentation</tspan>, <tspan font-weight="bold">Outstanding Creativity</tspan>,
    </text>
    <text x="0" y="24" font-size="16.5" font-style="italic" fill="#222">
      and <tspan font-weight="bold">Innovation</tspan> demonstrated through the invention titled
    </text>
  </g>

  <!-- Invention Title (Prominent Display) -->
  <g text-anchor="middle" transform="translate(470, 524)">
    <rect x="-195" y="-12" width="390" height="58" rx="4" fill="#000000" fill-opacity="0.03"/>
    <text x="0" y="10" font-family="'Arial Black',Arial,sans-serif" font-weight="bold" font-size="13.5" fill="#111">
      Reducing credit barriers for small and medium-sized enterprises
    </text>
    <text x="0" y="30" font-family="'Arial Black',Arial,sans-serif" font-weight="bold" font-size="13.5" fill="#111">
      in Vietnam through an AI-powered financial risk assessment model.
    </text>
  </g>

  <!-- Exhibition & Organization -->
  <g text-anchor="middle" transform="translate(470, 615)" font-style="italic">
    <text x="0" y="0" font-size="14.5" fill="#333">Exhibited at</text>
    <text x="0" y="24" font-size="16" font-weight="bold" font-style="normal" fill="#111">the World Invention Creativity Olympics 2026</text>
    <text x="0" y="50" font-size="14.5" fill="#333">Organized by</text>
    <text x="0" y="74" font-size="16" font-weight="bold" font-style="normal" fill="#111">the Korea University Intellectual Property Association.</text>
  </g>

  <!-- Date & Location -->
  <g text-anchor="middle" transform="translate(470, 730)">
    <text x="0" y="0" font-size="17" font-weight="bold" fill="#111">July 16 - 18, 2026</text>
    <text x="0" y="25" font-size="17" font-weight="bold" fill="#111" letter-spacing="1">Seoul, KOREA</text>
  </g>

  <!-- Bottom Authority Signatures & Official Seals -->
  <g transform="translate(290, 790)">
    <!-- KUIPA block -->
    <text x="0" y="24" font-family="'Arial Black',Impact,sans-serif" font-size="22" font-weight="bold" fill="#0D5C96">KU<tspan fill="#F5A800">!</tspan>PA</text>
    <text x="0" y="38" font-family="Arial,sans-serif" font-size="9" font-weight="bold" fill="#222">한국대학지식재산협회</text>
    <text x="0" y="48" font-family="Arial,sans-serif" font-size="7.5" fill="#555">Korea University Intellectual Property Association</text>
    <text x="0" y="72" font-size="13" font-weight="bold" fill="#111">President / Ph.D.</text>
    <text x="10" y="98" font-family="'Gulim',sans-serif" font-size="20" font-weight="bold" fill="#111">이 주 형</text>
    <rect x="75" y="80" width="22" height="22" fill="#D9281C" rx="2"/>
    <text x="86" y="96" text-anchor="middle" font-family="'Gulim',sans-serif" font-size="11" font-weight="bold" fill="#FFF">인</text>
  </g>

  <g transform="translate(545, 790)">
    <!-- WICO block -->
    <text x="0" y="24" font-family="'Arial Black',Impact,sans-serif" font-size="24" font-weight="900">
      <tspan fill="#0D5C96">W</tspan><tspan fill="#E54124">I</tspan><tspan fill="#3FA535">C</tspan><tspan fill="#F5A800">O</tspan>
    </text>
    <text x="0" y="36" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#333">WORLD INVENTION</text>
    <text x="0" y="44" font-family="Arial,sans-serif" font-size="7" font-weight="bold" fill="#333">CREATIVITY OLYMPIC</text>
    <text x="0" y="66" font-size="12" font-weight="bold" fill="#111">Chairperson of the</text>
    <text x="0" y="80" font-size="12" font-weight="bold" fill="#111">Organizing Committee</text>
    <text x="15" y="105" font-family="'Gulim',sans-serif" font-size="20" font-weight="bold" fill="#111">김 영 상</text>
  </g>

  <!-- Bottom Badges & Seals -->
  <g transform="translate(470, 965)" text-anchor="middle">
    <line x1="-220" y1="-25" x2="220" y2="-25" stroke="#DDD" stroke-width="1"/>
    <circle cx="0" cy="5" r="24" fill="#FFF" stroke="#333" stroke-width="1.5"/>
    <path d="M-10,0 C-10,-12 10,-12 10,0 C10,12 -10,12 -10,0 Z" fill="#0D5C96"/>
    <path d="M-6,2 C-6,-7 6,-7 6,2 Z" fill="#E54124"/>
    <text x="0" y="38" font-family="Arial,sans-serif" font-size="8" font-weight="bold" fill="#333">교육기부 우수기관</text>
    <text x="-80" y="38" font-family="Arial,sans-serif" font-size="7" fill="#555">국립중앙과학관 / 한국폴리텍대학</text>
    <text x="80" y="38" font-family="Arial,sans-serif" font-size="7" fill="#555">지식재산처 / 특허청</text>
  </g>

  <!-- ESG Lohas -->
  <g transform="translate(190, 1030)">
    <text x="0" y="0" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">LOHAS</text>
  </g>
  <g transform="translate(680, 1030)">
    <text x="0" y="0" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#1B5E20">ESG Lohas</text>
  </g>

  <!-- LEFT SIDE: HANGING GOLD MEDAL & EMBOSSED RIBBON -->
  <g filter="url(#dropShadow)" transform="translate(0, 0)">
    <!-- Silk Fabric Ribbon -->
    <path d="M0,0 L185,0 L185,1140 L115,1140 L115,0 L0,0 Z" fill="url(#goldRibbon)" opacity="0.95"/>
    <rect x="135" y="0" width="35" height="1140" fill="#B35E10" opacity="0.8"/>
    <!-- Korea University Ribbon typography -->
    <g transform="translate(162, 930) rotate(-90)">
      <text font-family="'Times New Roman',Georgia,serif" font-size="28" font-weight="bold" font-style="italic" fill="#FFF" letter-spacing="3" opacity="0.95">
        Korea University
      </text>
    </g>

    <!-- Round Gold Medal -->
    <g transform="translate(118, 325)">
      <circle r="108" fill="url(#goldMedal)" stroke="#8A5C0E" stroke-width="4"/>
      <circle r="98" fill="none" stroke="#FFF" stroke-width="2" stroke-dasharray="4 3" opacity="0.7"/>
      <circle r="94" fill="url(#goldMedal)"/>
      <circle r="90" fill="none" stroke="#7A4E08" stroke-width="2.5"/>

      <!-- Red Enamel Flower / Crest at top of medal -->
      <g transform="translate(0, -58)">
        <circle r="18" fill="url(#sealRed)" stroke="#FFE79A" stroke-width="1.5"/>
        <circle cx="-5" cy="-3" r="5" fill="#FFE79A" opacity="0.6"/>
        <circle cx="5" cy="-3" r="5" fill="#FFE79A" opacity="0.6"/>
        <circle cx="0" cy="5" r="5" fill="#FFE79A" opacity="0.6"/>
      </g>

      <!-- Embossed Center Text -->
      <text x="0" y="-8" text-anchor="middle" font-family="'Arial Black',Impact,sans-serif" font-size="40" font-weight="900" fill="#422904" letter-spacing="2">
        WICO
      </text>
      <text x="0" y="10" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#3D2603" letter-spacing="1.2">
        WORLD INVENTION
      </text>
      <text x="0" y="21" text-anchor="middle" font-family="Arial,sans-serif" font-size="8.5" font-weight="bold" fill="#3D2603" letter-spacing="1.2">
        CREATIVITY OLYMPIC
      </text>

      <rect x="-55" y="38" width="110" height="24" rx="4" fill="#3D2603" opacity="0.9"/>
      <text x="0" y="55" text-anchor="middle" font-family="'Arial Black',Impact,sans-serif" font-size="16" font-weight="bold" fill="#FFE79A" letter-spacing="2">
        KOREA
      </text>
    </g>
  </g>
</svg>
